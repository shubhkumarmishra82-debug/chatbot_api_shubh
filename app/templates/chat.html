<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{APP_NAME}}</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2d36;
    --text: #f4f4f6;
    --muted: #9599a6;
    --grad1: #6366F1;
    --grad2: #8B5CF6;
    --grad3: #EC4899;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    background: linear-gradient(90deg, var(--grad1), var(--grad2), var(--grad3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub { font-size: 12px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: linear-gradient(90deg, var(--grad1), var(--grad3));
    color: white;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag.custom { background: rgba(99,102,241,0.15); color: #a5a8f5; }
  .tag.ai { background: rgba(236,72,153,0.15); color: #f5a5c8; }
  .tag.search { background: rgba(0,200,150,0.15); color: #4ade80; }
  .tag.fallback { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .sources { margin-top: 8px; font-size: 12px; }
  .sources a { color: #8B5CF6; text-decoration: none; display: block; margin-top: 3px; }
  .sources a:hover { text-decoration: underline; }
  #inputBar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }
  #msgInput {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
  }
  #msgInput:focus { outline: none; border-color: var(--grad2); }
  #sendBtn {
    background: linear-gradient(90deg, var(--grad1), var(--grad3));
    border: none;
    color: white;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
  .empty-state { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <header>
    <h1>{{APP_NAME}}</h1>
    <span class="sub">— test console</span>
  </header>

  <div id="messages">
    <div class="empty-state" id="emptyState">Send a message to start testing your bot's responses.</div>
  </div>

  <div id="inputBar">
    <input id="msgInput" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

<script>
let conversationId = null;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function addBubble(role, text) {
  document.getElementById('emptyState')?.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTyping() {
  document.getElementById('emptyState')?.remove();
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  row.innerHTML = '<div class="bubble typing">Thinking...</div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  document.getElementById('typingRow')?.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addBubble('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: conversationId })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { throw new Error('Server returned: ' + raw.slice(0, 300)); }
    if (!res.ok) throw new Error(data.error || 'Request failed');

    conversationId = data.conversation_id;
    removeTyping();

    const bubble = addBubble('bot', data.reply);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span class="tag ${data.answer_type}">${data.answer_type}</span>`;
    if (data.sources && data.sources.length) {
      const srcDiv = document.createElement('div');
      srcDiv.className = 'sources';
      data.sources.forEach(s => {
        const a = document.createElement('a');
        a.href = s.link;
        a.target = '_blank';
        a.textContent = s.title;
        srcDiv.appendChild(a);
      });
      meta.appendChild(srcDiv);
    }
    bubble.parentElement.appendChild(meta);
  } catch (e) {
    removeTyping();
    addBubble('bot', 'Error: ' + e.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
